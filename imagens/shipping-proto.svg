<rect x="505" y="365" width="222" height="78" fill="#eee" stroke="#555"/>
<text x="518" y="399">Definições de</text><text x="518" y="428">entradas e saídas</text>
<line x1="505" y1="404" x2="320" y2="337" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="505" y1="404" x2="377" y2="466" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
