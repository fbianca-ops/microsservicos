<svg xmlns="http://www.w3.org/2000/svg" width="900" height="550" viewBox="0 0 900 550">
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#666"/></marker></defs>
<rect width="900" height="550" fill="white"/>
<g font-family="DejaVu Sans Mono" font-size="22" fill="#555">
<text x="25" y="42"><tspan font-weight="700">syntax</tspan> = "proto3";</text>
<text x="25" y="122"><tspan font-weight="700">service</tspan> <tspan fill="#e00000" font-weight="700">ShippingService</tspan> {</text>
<text x="78" y="162"><tspan font-weight="700">rpc</tspan> GetShippingRate(<tspan fill="#e00000" font-weight="700">ShippingPayload</tspan>) <tspan font-weight="700">returns</tspan> (<tspan fill="#e00000" font-weight="700">ShippingResponse</tspan>) {}</text>
<text x="25" y="202">}</text>
<text x="25" y="282"><tspan font-weight="700">message</tspan> <tspan fill="#e00000" font-weight="700">ShippingPayload</tspan> {</text>
<text x="78" y="322"><tspan font-weight="700">string</tspan> cep = 1;</text>
<text x="25" y="362">}</text>
<text x="25" y="442"><tspan font-weight="700">message</tspan> <tspan fill="#e00000" font-weight="700">ShippingResponse</tspan> {</text>
<text x="78" y="482"><tspan font-weight="700">float</tspan> value = 1;</text>
<text x="25" y="522">}</text>
</g>
<g font-family="Arial" font-size="24" fill="#000">
<rect x="435" y="10" width="278" height="61" fill="#eee" stroke="#555"/>
<text x="466" y="49">Definição do Serviço</text>
<line x1="435" y1="41" x2="255" y2="93" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="505" y="226" width="222" height="60" fill="#eee" stroke="#555"/>
<text x="518" y="265">Operações</text>
