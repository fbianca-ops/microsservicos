<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Micro Livraria</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css"
    />
    <link rel="stylesheet" href="index.css" />
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
    <script src="index.js"></script>
  </head>
  <body>
    <section class="hero is-info">
      <div class="hero-body">
        <div class="container has-text-centered">
          <p class="title">Micro Livraria</p>
          <p class="subtitle">Uma simples livraria utilizando microservices</p>
        </div>
      </div>
    </section>

    <div class="container" style="margin-top: 2rem;">
      <div class="columns is-centered">
        <div class="column is-6">
          <div class="field has-addons">
            <div class="control is-expanded">
              <input
                id="product-id"
                class="input"
                type="text"
                placeholder="Digite o ID do livro..."
              />
            </div>
            <div class="control">
              <button id="button-search" class="button is-info">
                Pesquisar
              </button>
            </div>
            <div class="control">
              <button id="button-list-all" class="button is-light">
                Listar Todos
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <section class="container" style="margin-top: 2rem;">
      <div class="columns is-multiline books"></div>
    </section>
  </body>
</html>
